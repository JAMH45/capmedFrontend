<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaSales Pro - Curso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/petite-vue" defer></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
</head>

<style>
  body {
    font-family: "Roboto", "Open Sans", sans-serif;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    #content {
      margin-left: 0 !important;
    }
  }
</style>

<body class="bg-gray-100 min-h-screen">

  <!-- Overlay para sidebar móvil -->
  <div id="overlay" class="overlay"></div>

  <!-- Sidebar (responsive) -->
  <div v-scope="Header()"></div>

  <!-- Header Móvil -->
  <header class="block md:hidden fixed top-0 inset-x-0 z-50 bg-blue-950/95 backdrop-blur border-b border-blue-900">
    <div class="h-14 px-4 flex items-center justify-between">
      <button id="mobile-toggle" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-blue-800 text-gray-100 hover:bg-blue-900 active:scale-95 transition" aria-label="Abrir menú">
        <i class="fas fa-bars text-xl"></i>
      </button>
      <span class="text-lg font-bold text-white">Examen</span>
      <div class="w-12"></div>
    </div>
  </header>

  <main id="content" class="transition-all duration-300 mb-4 pt-14 md:pt-0">
    <section class="m-3 sm:m-5 pb-6 bg-white rounded-lg shadow-md">
      
      <!-- Header del section -->
      <div class="p-4 sm:p-5 bg-blue-950 rounded-t-lg w-full text-center">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white mb-2 sm:mb-4">
          PharmaSales Pro
        </h1>
        <h2 class="text-base sm:text-lg md:text-xl font-bold text-blue-200">Examen</h2>
      </div>

      <!-- Título del examen -->
      <div class="px-4 sm:px-5 py-3 sm:py-4">
        <h1 class="text-lg sm:text-xl md:text-2xl font-extrabold text-blue-950 mb-2 flex items-center justify-center md:justify-start gap-2 sm:gap-3">
          <i class="fa-solid fa-clipboard text-blue-950 text-lg sm:text-xl md:text-2xl"></i>
          <span id="tituloExamen"></span>
        </h1>
      </div>

      <!-- Contenedor del examen -->
      <div id="examenContainer" class="flex flex-col items-center gap-4 sm:gap-6 px-3 sm:px-5 pb-6 sm:pb-8"></div>
      
    </section>
  </main>

</body>

<script type="module" src="./js/main.js"></script>
<script src="./js/components/slide.js"></script>
<script src="./js/examen/examen.js"></script>

</html>
