<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillpills- Curso</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/petite-vue" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css"
    />
    <!-- Iconos de FontAwesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <style>
    body {
      font-family: "Roboto", "Open Sans", sans-serif;
    }

    /* Quitar margin-left en móvil */
    @media (max-width: 768px) {
      #content {
        margin-left: 0 !important;
      }
    }
  </style>
  <body class="bg-white-100 min-h-screen">
    <!-- Overlay para cerrar sidebar en móvil -->
    <div id="overlay" class="overlay"></div>

    <!-- Sidebar (mismo para móvil y web) -->
    <div class="hidden md:block" v-scope="Header()"></div>
    <div class="flex md:hidden" v-scope="HeaderMv()"></div>

    <!-- Header Móvil con botón de menú -->
  

    <!-- Contenido Principal -->
    <main id="content" class="transition-all duration-300 mb-4 md:pt-0 relative z-0">
      <section>
        <!-- TOP: 2 cards (stack en móvil, side-by-side en md+) -->
        <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="my-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">
            <!-- Izquierda: morado metálico -->
            <div
              class="relative rounded-[30px] bg-gradient-to-br from-purple-700 via-purple-800 to-purple-900 shadow-lg overflow-hidden min-h-[220px] md:min-h-[320px]"
            >
              <!-- Arriba derecha -->
              <div
                class="absolute top-4 right-4 text-white text-xs sm:text-sm font-light tracking-wide"
              >
                Rodrigo Mauricio Galindo Perez / ID: 123456789
              </div>

              <!-- Centro -->
              <div
                class="absolute inset-0 flex items-center justify-center px-4"
              >
                <div class="flex items-center gap-4 text-white">
                  <!-- Foto -->
                  <img
                    src="assets/img/contenido/tipo.png"
                    alt="Avatar"
                    class="w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full object-cover border border-white/30"
                  />

                  <!-- Texto al lado -->
                  <div>
                    <p class="text-3xl sm:text-4xl lg:text-5xl font-light">
                      Hola, Rodrigo
                    </p>
                    <p class="text-sm sm:text-base lg:text-lg text-white/80">
                      Bienvenido de vuelta
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Derecha: imagen REAL -->
            <div class="rounded-[30px] overflow-hidden shadow-lg">
              <img
                src="assets/img/contenido/img02.png"
                alt="Imagen"
                class="w-full h-full object-cover"
              />
            </div>
          </div>
        </div>

        <!-- Subtítulo + tarjetas -->
        <div class="w-full bg-gray-100/40 rounded-2xl px-4 sm:px-8 py-6">
          <!-- Texto -->
          <div class="mx-auto w-full max-w-7xl text-center mb-8">
            <p class="text-3xl sm:text-5xl lg:text-6xl text-gray-500 mb-2">
              Una plataforma, cualquier aplicación.
            </p>
            <p class="text-base sm:text-xl lg:text-2xl text-gray-400">
              Estos son tus cursos disponibles selecciona uno para continuar.
            </p>
          </div>

          <!-- Tarjetas -->
          <div class="mx-auto w-full max-w-7xl">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              <!-- Tarjeta 1 -->
              <div
                class="w-full max-w-[260px] mx-auto rounded-xl overflow-hidden cursor-pointer transform transition hover:scale-105"
              >
                <img
                  src="assets/img/contenido/materna.png"
                  alt="Card 1"
                  class="w-full h-full object-cover"
                />
              </div>

              <!-- Tarjeta 2 -->
              <div
                class="w-full max-w-[260px] mx-auto rounded-xl overflow-hidden cursor-pointer transform transition hover:scale-105"
              >
                <img
                  src="assets/img/contenido/matercollagen.png"
                  alt="Card 2"
                  class="w-full h-full object-cover"
                />
              </div>

              <!-- Tarjeta 3 -->
              <a href="semana.html" class="block">
                <div
                  class="w-full max-w-[260px] mx-auto rounded-xl overflow-hidden cursor-pointer transform transition hover:scale-105"
                >
                  <img
                    src="assets/img/contenido/casec.png"
                    alt="Card 3"
                    class="w-full h-full object-cover"
                  />
                </div>
              </a>
            </div>
          </div>
        </div>

        <br /><br />
        <div class="hidden md:block" v-scope="FooterWb()"></div>
      </section>
    </main>
  </body>
  <script type="module" src="./js/main.js"></script>
  <script src="./js/components/slide.js"></script>
  <script src="./js/cursos/cursos.js"></script>
</html>
