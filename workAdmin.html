<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaSales Pro - Configuración del curso</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/petite-vue" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css"
    />
    <!-- Iconos de FontAwesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <style>
    body {
      font-family: "Roboto", "Open Sans", sans-serif;
    }
    .semana-contenido {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .semana-contenido.abierta {
      max-height: 1000px; /* suficiente para el contenido */
      padding-top: 0.75rem; /* py-3 */
      padding-bottom: 0.75rem;
    }

    .chevron-rotado {
      transform: rotate(180deg);
    }
  </style>
  <body>
    <section class="mt-[1%] mb-5 px-1 flex-grow hidden md:block">
      <!-- Sidebar -->
      <div class="hidden md:block" v-scope="Header()"></div>

      <main
        id="content"
        class="hidden md:block transition-all duration-300 ml-[80px]"
      >
        <section
          class="pb-5 pt-1 mb-5 bg-white rounded-lg shadow-md shadow-black/85 shadow-[0_3px_2px_rgba(0,0,0,0.85)]"
        >
          <!-- Título principal -->
          <div class="p-5 bg-blue-950 rounded-t-lg w-full text-center">
            <h1 class="text-4xl font-extrabold text-white mb-2">
              PharmaSales Pro
            </h1>

            <!-- Subtítulo del medicamento -->
            <h2 class="text-xl font-bold text-blue-200">
              <span id="nameCurso"></span> — Medicamento del curso
            </h2>
          </div>

          <!-- Título Configuración -->
          <div class="px-5 py-4">
            <div class="flex items-center justify-between gap-3">
              <h1
                class="text-2xl font-extrabold text-blue-950 mb-2 flex items-center gap-3"
              >
                <i class="fa-solid fa-sliders text-blue-950 text-2xl"></i>
                Configuración del curso
              </h1>

              <!-- Botón nuevo medicamento -->
              <button
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                data-open-modal="nuevaSemana"
              >
                <i class="fa-solid fa-plus"></i>
                Agregar Semana
              </button>
            </div>
          </div>

          <!-- SEMANAS (Acordeón sin JS por ahora) -->
          <div class="px-5 pb-5" id="listaSemanas">
            <!-- Aquí se van a generar las semanas con JS -->
          </div>

          <!-- (Aquí deja tu modal de actividad tal como lo tienes) -->
          <div
            id="modal-actividad"
            class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60"
          >
            <div class="bg-white rounded-lg shadow-lg w-full max-w-2xl mx-4">
              <!-- Header -->
              <div class="flex items-center justify-between border-b px-4 py-3">
                <h2
                  id="modal-actividad-titulo"
                  class="text-xl font-bold text-blue-950"
                >
                  <!-- Título dinámico -->
                </h2>
                <button
                  class="text-slate-500 hover:text-slate-700 text-2xl leading-none"
                  data-close-modal="actividad"
                >
                  &times;
                </button>
              </div>

              <form id="modal-actividad-form">
                <!-- Contenido dinámico -->
                <div
                  id="modal-actividad-body"
                  class="px-4 py-4 space-y-4 max-h-[70vh] overflow-y-auto"
                ></div>

                <!-- Footer -->
                <div class="flex justify-end gap-2 border-t px-4 py-3">
                  <button
                    class="px-4 py-2 text-sm rounded-md border border-slate-300 text-slate-700 hover:bg-slate-100"
                    data-close-modal="actividad"
                    type="button"
                  >
                    Cancelar
                  </button>
                  <button
                    id="modal-actividad-guardar"
                    type="button"
                    class="px-4 py-2 text-sm rounded-md bg-blue-600 text-white font-semibold hover:bg-blue-700"
                  >
                    Guardar cambios
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Modal de confirmación para borrar -->
          <div
            id="modal-confirm-delete"
            class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-[9999]"
          >
            <div class="bg-white rounded-lg shadow-lg p-6 w-[350px] space-y-4">
              <h2 class="text-xl font-bold text-slate-800">
                Confirmar borrado
              </h2>
              <p id="confirm-delete-text" class="text-slate-600 text-sm">
                ¿Deseas borrar esta configuración?
              </p>

              <div class="flex justify-end gap-3 mt-4">
                <button
                  id="btn-cancel-delete"
                  class="px-4 py-2 rounded-md bg-slate-200 hover:bg-slate-300 text-slate-800"
                >
                  Cancelar
                </button>

                <button
                  id="btn-confirm-delete"
                  class="px-4 py-2 rounded-md bg-red-600 hover:bg-red-700 text-white"
                >
                  Borrar
                </button>
              </div>
            </div>
          </div>

          <!-- Modal de éxito -->
          <div
            id="modal-delete-success"
            class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-[9999]"
          >
            <div
              class="bg-white rounded-lg shadow-lg p-6 w-[350px] space-y-4 text-center"
            >
              <h2 class="text-xl font-bold text-green-700">
                ¡Borrado exitoso!
              </h2>
              <p class="text-slate-600 text-sm">
                La configuración ha sido eliminada correctamente.
              </p>

              <button
                id="btn-close-success"
                class="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white mt-2"
              >
                Aceptar
              </button>
            </div>
          </div>
        </section>
      </main>
    </section>

    <!-- Modal Nueva Semana -->
    <div
      id="modalNuevaSemana"
      class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
        <h2 class="text-xl font-bold text-blue-950 mb-4">
          Agregar nueva semana
        </h2>

        <form id="formNuevaSemana" class="space-y-4">
          <!-- Título de la semana -->
          <div>
            <label
              for="semanaTitulo"
              class="block text-sm font-semibold text-gray-700 mb-1"
            >
              Título de la semana
            </label>
            <input
              type="text"
              id="semanaTitulo"
              name="titulo"
              required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Ej. Introducción a CASEC, Seguimiento clínico, etc."
            />
          </div>

          <!-- Descripción de la semana -->
          <div>
            <label
              for="semanaDescripcion"
              class="block text-sm font-semibold text-gray-700 mb-1"
            >
              Descripción
            </label>
            <textarea
              id="semanaDescripcion"
              name="description"
              rows="4"
              required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Breve descripción de lo que se verá en esta semana..."
            ></textarea>
          </div>

          <div class="mt-6 flex justify-end gap-3">
            <button
              type="button"
              class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm hover:bg-gray-50"
              data-close-modal="nuevaSemana"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700"
            >
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!--Modal de agregarActividadASemana-->
    <div
      id="modalNuevaActividad"
      class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden"
    >
      <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 space-y-4">
        <h2 class="text-xl font-bold text-blue-950">Nueva Actividad</h2>

        <form id="formNuevaActividad" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold">Título</label>
            <input
              type="text"
              id="actTitulo"
              class="w-full border rounded px-3 py-2"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-semibold">Descripción</label>
            <textarea
              id="actDescripcion"
              class="w-full border rounded px-3 py-2"
              rows="4"
              required
            ></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold">Tipo</label>
            <select id="actTipo" class="w-full border rounded px-3 py-2">
              <option value="video">Video</option>
              <option value="lectura">Lectura</option>
              <option value="audio">Audio</option>
              <option value="examen">Examen</option>
              <option value="agente">Roleplay Agente</option>
              <option value="doctor">Roleplay Doctor</option>
            </select>
          </div>

          <div class="flex justify-end gap-2 pt-3">
            <button
              type="button"
              class="px-4 py-2 rounded border"
              data-close-modal="actividad"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="px-4 py-2 rounded bg-blue-600 text-white"
            >
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>

  <script type="module" src="./js/main.js"></script>
  <script src="./js/components/slide.js"></script>
  <script src="./js/ia.js"></script>
  <script src="./js/admin/admin.js"></script>
  <script src="./js/admin/registrarSemanas.js"></script>
  <script src="./js/admin/cargarSemanas.js"></script>
</html>
